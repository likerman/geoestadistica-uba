project:
  type: book
  output-dir: _book
  execute-dir: project
  resources:
    - ejemplos/*.ipynb

lang: es
date-format: long

book:
  title: "Manual de Geoestadística"
  subtitle: "Fundamentos teóricos y ejemplos geológicos"
  author: "Dr. Jeremías Likerman"
  date: "2026-09-04"
  cover-image: recursos/identidad/banner_youtube.png
  cover-image-alt: "Banner de Geoestadística de Ciencias Geológicas, FCEN, UBA"
  sidebar:
    logo: recursos/identidad/logo.png
    logo-alt: "Logo de Geoestadística"
    style: floating
  site-url: "https://likerman.github.io/geoestadistica-uba/"
  repo-url: "https://github.com/likerman/geoestadistica-uba"
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - capitulos/00-como-leer.qmd
    - capitulos/00-notacion-prerrequisitos.qmd
    - part: "I. Del dato a la descripción"
      chapters:
        - capitulos/01-introduccion-geoestadistica.qmd
        - capitulos/02-poblacion-muestra-muestreo.qmd
        - capitulos/03-tipos-calidad-datos.qmd
    - part: "II. Estadística descriptiva"
      chapters:
        - capitulos/04-distribuciones-graficos.qmd
        - capitulos/05-posicion.qmd
        - capitulos/06-dispersion.qmd
        - capitulos/07-forma-diagnostico.qmd
    - part: "III. Probabilidad e inferencia"
      chapters:
        - capitulos/08-probabilidad.qmd
        - capitulos/09-muestreo-e-inferencia.qmd
        - capitulos/10-hipotesis.qmd
    - ejemplos/01-caso-sintetico.qmd
    - glosario.qmd
    - referencias.qmd

bibliography: referencias.bib

format:
  html:
    theme:
      - cosmo
      - recursos/identidad/tema.scss
    toc: true
    number-sections: true
    code-fold: true
    code-tools: true
    code-copy: true
    link-external-newwindow: true
  pdf:
    documentclass: scrreprt
    number-sections: true

execute:
  freeze: auto
