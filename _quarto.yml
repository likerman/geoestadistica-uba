project:
  type: book
  output-dir: _book

lang: es

book:
  title: "Manual de Geoestadística"
  subtitle: "Fundamentos teóricos y ejemplos geológicos"
  author: "Dr. Jeremías Likerman"
  date: "2026"
  site-url: "https://likerman.github.io/geoestadistica-uba/"
  repo-url: "https://github.com/likerman/geoestadistica-uba"
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - capitulos/00-como-leer.qmd
    - part: "I. Del dato a la descripción"
      chapters:
        - capitulos/01-introduccion-geoestadistica.qmd
        - capitulos/02-poblacion-muestra-muestreo.qmd
        - capitulos/03-tipos-calidad-datos.qmd
    - part: "II. Estadística descriptiva"
      chapters:
        - capitulos/04-distribuciones-graficos.qmd
        - capitulos/05-posicion.qmd
        - capitulos/06-dispersion.qmd
        - capitulos/07-forma-diagnostico.qmd
    - part: "III. Incertidumbre e inferencia"
      chapters:
        - capitulos/05-probabilidad.qmd
        - capitulos/06-muestreo-e-inferencia.qmd
        - capitulos/07-hipotesis.qmd
    - part: "IV. Relaciones entre variables"
      chapters:
        - capitulos/08-correlacion-regresion.qmd
        - capitulos/09-metodos-multivariados.qmd
    - part: "V. Dependencia espacial"
      chapters:
        - capitulos/10-variable-regionalizada.qmd
        - capitulos/11-variograma.qmd
        - capitulos/12-kriging.qmd
    - capitulos/13-cierre.qmd
    - glosario.qmd
    - referencias.qmd

bibliography: referencias.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
    code-tools: true
    code-copy: true
    link-external-newwindow: true
  pdf:
    documentclass: scrreprt
    number-sections: true

execute:
  freeze: auto
